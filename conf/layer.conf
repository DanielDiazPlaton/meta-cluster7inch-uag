# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cluster7inch-uag"
BBFILE_PATTERN_meta-cluster7inch-uag = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cluster7inch-uag = "6"

LAYERDEPENDS_meta-cluster7inch-uag = "core"
LAYERSERIES_COMPAT_meta-cluster7inch-uag = "scarthgap"


# ============================================================
# Global configuration of UAG cluster
# ============================================================

MACHINE ?= "raspberrypi4-64"
ENABLE_UART = "1"
ENABLE_I2C = "1"
RPI_USE_U_BOOT = "1"
GPU_MEM = "256"
KERNEL_IMAGETYPES += "Image"
IMAGE_FSTYPES += "tar.bz2 wic.bz2 wic.bmap"
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

# Configuración del Device Tree para CAN bus (MCP2515) y Pantalla
RPI_EXTRA_CONFIG = ' \n \
dtparam=spi=on \n \
dtoverlay=mcp2515-can0,oscillator=8000000,interrupt=25 \n \
total_mem=3072 \n \
dtoverlay=vc4-kms-v3d \n \
'

# Configuración del Sistema Operativo (Systemd + Usrmerge)
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
ROOT_HOME = "/root"
